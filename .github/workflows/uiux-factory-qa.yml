name: UIUX Factory QA

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "feat/**"

permissions:
  contents: read

jobs:
  rendered-qa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify JavaScript syntax
        run: |
          node --check script.js
          node --check routes.js
          node --check shared/nav.js

      - name: Verify preserved cinematic engine blob
        shell: bash
        run: |
          ACTUAL=$(git hash-object script.js)
          EXPECTED="ac4a26e4e98bb56fffe3ac7213b2951f12560543"
          echo "script.js blob: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Verify Huế production asset contract
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/hue/CREDITS.md
          test -f assets/hue/asset-manifest.json
          test -f assets/hue/previews/scene-contact-sheet.webp
          test "$(find assets/hue/scenes -maxdepth 1 -name '*.webp' | wc -l)" -eq 7
          test "$(find assets/hue/cards -maxdepth 1 -name '*.webp' | wc -l)" -eq 5
          test "$(find assets/hue/markers -maxdepth 1 -name '*.svg' | wc -l)" -eq 3

          if grep -nE 'raft-blast-61784561|d8j0ntlcm91z4' index.html routes.html hue.css hue-routes.css; then
            echo "Old remote Mostar scene/pin asset reference found in production UI"
            exit 1
          fi

          if grep -niE 'Mostar|Bosnia and Herzegovina|Stari Most|Neretva|Kujundžiluk|Kujundziluk|Koski Mehmed|Kajtaz House|War Photo Exhibition' index.html routes.html; then
            echo "Stale Mostar identity found in user-facing production HTML"
            exit 1
          fi

      - name: Install rendered QA browser
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Start static server
        shell: bash
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/hue-server.log 2>&1 &
          echo $! > /tmp/hue-server.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hue-server.log
          exit 1

      - name: Run Chromium smoke and responsive checks
        env:
          QA_BASE_URL: http://127.0.0.1:4173
        run: python qa/render_smoke.py

      - name: Run Lighthouse accessibility gate
        shell: bash
        run: |
          CHROME_PATH=$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(p.chromium.executable_path)
          PY
          )
          export CHROME_PATH
          npx --yes lighthouse http://127.0.0.1:4173/index.html \
            --only-categories=accessibility \
            --chrome-flags="--headless --no-sandbox" \
            --output=json --output-path=qa-artifacts/lighthouse-home.json --quiet
          npx --yes lighthouse http://127.0.0.1:4173/routes.html \
            --only-categories=accessibility \
            --chrome-flags="--headless --no-sandbox" \
            --output=json --output-path=qa-artifacts/lighthouse-routes.json --quiet
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("home", "routes"):
              data = json.loads(Path(f"qa-artifacts/lighthouse-{name}.json").read_text())
              score = data["categories"]["accessibility"]["score"]
              print(f"{name} accessibility={score:.2f}")
              if score < 0.90:
                  raise SystemExit(f"Accessibility gate failed for {name}: {score:.2f} < 0.90")
          PY

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hue-uiux-qa-evidence
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/hue-server.log || true
