name: UIUX Factory QA

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "feat/**"

permissions:
  contents: read

jobs:
  rendered-qa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify JavaScript syntax
        run: |
          node --check script.js
          node --check routes.js
          node --check shared/nav.js

      - name: Verify immutable cinematic engine blob
        shell: bash
        run: |
          ACTUAL=$(git hash-object script.js)
          EXPECTED="ac4a26e4e98bb56fffe3ac7213b2951f12560543"
          echo "script.js blob: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Verify remote assets respond
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://dcym8fthxf5uu.cloudfront.net/fonts/247a073c-29f5-4a89-aa3a-741020f346fc/OggText-Medium.woff2"
            "https://raft-blast-61784561.figma.site/_assets/v11/16b5007d9c93971e26ffe4e0e3e37946f6bd538c.png"
            "https://raft-blast-61784561.figma.site/_assets/v11/8a7f8af50e0ce92ec2e228e7b0b4112178c51cf1.png"
            "https://raft-blast-61784561.figma.site/_assets/v11/864afe00e41e2fa20a5aa546e15cb807e0f81384.png"
            "https://raft-blast-61784561.figma.site/_assets/v11/7536d7b60a1fce482cf6edf3f0bffd3bad5d0f8a.png"
            "https://raft-blast-61784561.figma.site/_assets/v11/392db6a6a6b98e868bd7f8d3f55bb719d51e5028.png"
            "https://raft-blast-61784561.figma.site/_assets/v11/c6a6d8ef49bca43f708aa852692942c45ec950d4.png"
            "https://raft-blast-61784561.figma.site/_assets/v11/ba75252bab2b1c510987b74837770f7bc8a6b2d4.png"
            "https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260730_230438_d526b8b6-8a2e-4e3b-9993-3908acae03a7.png"
            "https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260730_230442_140bc25b-b165-4249-904a-f708bff6970e.png"
            "https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260730_230448_825949c9-ccdb-4857-b4a6-e349eccc9010.png"
          )
          for url in "${urls[@]}"; do
            echo "Checking $url"
            curl --fail --location --silent --show-error --retry 2 --max-time 30 --output /dev/null "$url"
          done

      - name: Install rendered QA browser
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Start static server
        shell: bash
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/mostar-server.log 2>&1 &
          echo $! > /tmp/mostar-server.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mostar-server.log
          exit 1

      - name: Run Chromium smoke and responsive checks
        env:
          QA_BASE_URL: http://127.0.0.1:4173
        run: python qa/render_smoke.py

      - name: Run Lighthouse accessibility gate
        shell: bash
        run: |
          CHROME_PATH=$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(p.chromium.executable_path)
          PY
          )
          export CHROME_PATH
          npx --yes lighthouse http://127.0.0.1:4173/index.html \
            --only-categories=accessibility \
            --chrome-flags="--headless --no-sandbox" \
            --output=json --output-path=qa-artifacts/lighthouse-home.json --quiet
          npx --yes lighthouse http://127.0.0.1:4173/routes.html \
            --only-categories=accessibility \
            --chrome-flags="--headless --no-sandbox" \
            --output=json --output-path=qa-artifacts/lighthouse-routes.json --quiet
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("home", "routes"):
              data = json.loads(Path(f"qa-artifacts/lighthouse-{name}.json").read_text())
              score = data["categories"]["accessibility"]["score"]
              print(f"{name} accessibility={score:.2f}")
              if score < 0.90:
                  raise SystemExit(f"Accessibility gate failed for {name}: {score:.2f} < 0.90")
          PY

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mostar-uiux-qa-evidence
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/mostar-server.log || true
